<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D viewer</title>
    <!-- A part's .glb, given as ?src=<path relative to this page>: turn, zoom, no sign-in. -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js"></script>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; }
      model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
    </style>
  </head>
  <body>
    <model-viewer camera-controls touch-action="pan-y" shadow-intensity="0.6" exposure="1.1"
      camera-orbit="215deg 70deg auto"></model-viewer>
    <script>
      const src = new URLSearchParams(location.search).get('src')
      if (src) document.querySelector('model-viewer').src = src
    </script>
  </body>
</html>
