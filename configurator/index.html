<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configurator</title>
    <script>
      // Before the first paint, the mode App.tsx will set (src/App.theme.ts isDark): next-themes' stored `light` or
      // `dark`, the system's otherwise. Without it a page whose reader picked dark flashes light until the app loads.
      try {
        var theme = localStorage.getItem('theme')
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (error) {
        // No storage (blocked, or a sandboxed frame): the system's mode, from color-scheme below.
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        /* The docs' Material 3 roles, which <Mtb> defines: see src/App.theme.ts. Until it has (or with no script at
           all), the seed's surface in each mode, so the page never shows white first. */
        background: var(--md-sys-color-surface, light-dark(#fef8f4, #141311));
        color: var(--md-sys-color-on-surface, CanvasText);
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      /* leva writes a button's label in its value color, on-surface, which the seed's lime is too light to carry in
         dark mode: the role that goes on the button's container role instead. leva's class names are hashed, only
         their prefix is stable. */
      [class*='leva-'] button:not(:disabled) {
        color: var(--md-sys-color-on-primary-container);
      }
      /* The leva panel, capped to the viewport whatever sits above its controls. leva's own cap is on its content
         alone, `100vh - 20px - title bar`: it leaves out the search filter's row (30px, when open), so the panel then
         runs past the window; and `vh` is the viewport with a mobile browser's toolbars retracted, which can hide the
         panel's bottom. Here the panel itself is capped, to `dvh` (`vh` where unsupported) less leva's 10px offset
         above and below, and lays out as a column: title bar and filter row keep their heights, the content takes
         what is left and scrolls. Only while leva shows the panel: until there is a control it hides it, by an inline
         `display: none`. */
      .leva-panel {
        display: contents;
      }
      .leva-panel > [style*='display: block'] {
        display: flex !important;
        flex-direction: column;
        max-height: calc(100vh - 20px);
        max-height: calc(100dvh - 20px);
      }
      .leva-panel > div > * {
        flex-shrink: 0;
      }
      /* The content, leva's scroll container: it shrinks to what the column leaves, and a wheel or a swipe past its
         end stays there instead of scrolling the page around it (the docs page, around the iframe embed). */
      .leva-panel > div > :last-child {
        flex-shrink: 1;
        min-height: 0;
        max-height: none;
        overscroll-behavior: contain;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
